const exampleButton=document.createElement('button');exampleButton.type='button';exampleButton.className='example-link';exampleButton.textContent='查看使用示例 ↗';tip.append(exampleButton);const exampleDialog=document.createElement('dialog');exampleDialog.className='example-dialog';exampleDialog.innerHTML='<button class="btn example-close" aria-label="关闭示例">×</button><h2>使用示例</h2><p>将合并参考图、主角脸部参考图和提示词一起提交给 AI。</p><img src="assets/costume-example.png?v=2" alt="使用衣装和姿势参考图生成角色图片的示例">';document.body.append(exampleDialog);exampleButton.onclick=()=>exampleDialog.showModal();exampleDialog.querySelector('button').onclick=()=>exampleDialog.close();exampleDialog.onclick=e=>{if(e.target===exampleDialog)exampleDialog.close()};
const toast=document.createElement('div');toast.className='copy-toast';toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');document.body.append(toast);let toastTimer;function showToast(message,failed=false){toast.textContent=message;toast.classList.toggle('failed',failed);toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('visible'),2600)}
function options(el,values,label){el.innerHTML=`<option value="">${label}：全部</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
options($('#outfitFilter'),unique(COSTUMES.map(x=>x.category)),'衣装分类');options($('#poseFilter'),unique(POSES.filter(x=>x.group!=='双人姿势').map(x=>x.category)),'姿势分类');
function setMode(next){mode=next;limit=60;selectedGroup='';$('.slider').style.transform=`translateX(calc(${modes.indexOf(mode)} * (100% + 8px)))`;document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===mode));$('#gallery').hidden=mode==='random';$('#random').hidden=mode!=='random';$('#guideBar').hidden=mode==='random';$('#title').textContent={costume:'衣装图鉴',pose:'姿势图鉴',random:'随机灵感生成'}[mode];$('#subtitle').textContent={costume:'浏览衣装参考，寻找喜欢的搭配。',pose:'浏览姿势参考，寻找适合的构图。',random:'随机搭配衣装与姿势，生成你的创作参考。'}[mode];if(mode!=='random'){$('#search').value='';drawCategories();render()}else if(!currentOutfit)drawBoth()}
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function drawCategories(){const data=mode==='costume'?COSTUMES:POSES,field=mode==='costume'?'category':'group',groups=unique(data.map(x=>x[field]));$('#categoryTabs').innerHTML=[['',data.length],...groups.map(g=>[g,data.filter(x=>x[field]===g).length])].map(([g,n])=>`<button type="button" data-group="${esc(g)}" aria-pressed="${selectedGroup===g}">${esc(g||'全部')}<small>${n}张</small></button>`).join('')}
$('#categoryTabs').onclick=e=>{const b=e.target.closest('[data-group]');if(!b)return;selectedGroup=b.dataset.group;limit=60;drawCategories();render()};
function render(){const q=$('#search').value.trim().toLowerCase(),g=selectedGroup;let data=mode==='costume'?COSTUMES:POSES;view=data.filter(x=>(!g||(mode==='costume'?x.category:x.group)===g)&&(!q||[x.id,x.category,x.group,x.words,x.name,x.angle].filter(Boolean).join(' ').toLowerCase().includes(q)));$('#count').textContent=`${view.length} 张图片`;$('#grid').innerHTML=view.slice(0,limit).map((x,i)=>`<button class="card" data-i="${i}"><img loading="lazy" src="${esc(x.thumb)}" alt="${esc(x.id)}"><div class="meta"><strong>${esc(x.id)}</strong><span>${esc(mode==='costume'?x.category+' · '+x.words.replaceAll(' ',' · '):x.group+' · '+x.category+' · '+x.angle)}</span></div></button>`).join('')||'<p>没有找到符合条件的图片，请尝试其他关键词。</p>';$('#more').hidden=view.length<=limit;$('#more').textContent=`查看更多（剩余 ${Math.max(0,view.length-limit)} 张）`}
$('#search').oninput=()=>{limit=60;render()};$('#more').onclick=()=>{limit+=60;render()};
const notices=['图片可免费用于作品制作，包括商业使用、编辑和参考。','禁止再次分发、转载或转售图片数据，包括原尺寸及加工后的图片。','图片由 AI 生成或为模特线稿，并非真实商品或真实人物。','使用时请自行确认第三方权利；请勿用于表现真实人物、未成年人或违反公序良俗的用途。'];
$('#tips').onclick=()=>openGuide('使用提示',mode==='costume'?['将衣装图片作为参考图，导入 AI 工具。','点击分类筛选，或通过编号和关键词搜索。','打开原图可查看细节；人物脸部、体型和背景可通过其他参考图或提示词补充。']:['将姿势图片作为姿势或构图参考，导入 AI 工具。','点击分类筛选，或通过编号、类别和角度搜索。','姿势图是无脸模特线稿；脸部、服装和背景可通过其他参考图或提示词补充。']);$('#notice').onclick=()=>openGuide('注意事项',notices);function openGuide(title,items){$('#guideTitle').textContent=title;$('#guideList').innerHTML=items.map(x=>`<li>${esc(x)}</li>`).join('');$('#guideDialog').showModal()}$('#guideClose').onclick=()=>$('#guideDialog').close();
$('#grid').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const x=view[+b.dataset.i];$('#modalImg').src=x.full;$('#modalTitle').textContent=x.id;$('#modalInfo').textContent=mode==='costume'?x.words:x.group+' · '+x.category+' · '+x.angle;$('#modalDownload').href=x.full;$('#modal').showModal()};$('#close').onclick=()=>$('#modal').close();
function pick(a,old){if(!a.length)return null;let v=a[Math.floor(Math.random()*a.length)];if(a.length>1&&old&&v.id===old.id)v=a[(a.indexOf(v)+1+Math.floor(Math.random()*(a.length-1)))%a.length];return v}
function outfit(){currentOutfit=pick(COSTUMES.filter(x=>!$('#outfitFilter').value||x.category===$('#outfitFilter').value),currentOutfit);update()}
function pose(){currentPose=pick(POSES.filter(x=>x.group!=='双人姿势'&&(!$('#poseFilter').value||x.category===$('#poseFilter').value)),currentPose);update()}
function drawBoth(){outfit();pose()}function update(){if(!currentOutfit||!currentPose)return;$('#outfitImg').src=currentOutfit.thumb;$('#poseImg').src=currentPose.thumb;$('#outfitLabel').textContent=currentOutfit.id+' · '+currentOutfit.category;$('#poseLabel').textContent=currentPose.id+' · '+currentPose.category+' · '+currentPose.angle;$('#prompt').textContent=`请根据我提供的参考图片生成一张完整人物图像：\n\n1. 以单独提供的主角脸部参考图为准，保持人物面部特征和身份一致。\n2. 以合并参考图左侧的衣装为准，参考服装款式、颜色、材质和配饰。\n3. 以合并参考图右侧的姿势为准，参考身体姿态、手脚位置和朝向。\n\n请自然协调人物比例、服装穿着和身体姿势，保持画面完整、细节清晰。`;$('#status').textContent=''}
$('#draw').onclick=drawBoth;$('#redrawOutfit').onclick=outfit;$('#redrawPose').onclick=pose;$('#outfitFilter').onchange=outfit;$('#poseFilter').onchange=pose;
async function imageFor(url){const img=new Image();img.crossOrigin='anonymous';img.src=url;await img.decode();return img}
async function merge(){if(!currentOutfit||!currentPose)throw Error('请先抽取图片');const [a,b]=await Promise.all([imageFor(currentOutfit.full),imageFor(currentPose.full)]);const h=1500,w=1000, canvas=document.createElement('canvas');canvas.width=w*2;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#f3f3f3';ctx.fillRect(0,0,canvas.width,h);for(const [img,x] of [[a,0],[b,w]]){let scale=Math.min(w/img.width,h/img.height);ctx.drawImage(img,x+(w-img.width*scale)/2,(h-img.height*scale)/2,img.width*scale,img.height*scale)}return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('无法生成图片')),'image/png'))}
async function run(action){try{$('#status').textContent='正在合成图片，请稍候…';await action();$('#status').textContent='完成。'}catch(e){$('#status').textContent='操作失败：'+e.message+'。请检查网络，或尝试下载。'}}
$('#copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText($('#prompt').textContent);showToast('✓ 提示词已复制')}catch(e){showToast('复制失败，请手动选中提示词复制',true)}};
$('#download').onclick=()=>run(async()=>{const blob=await merge(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='衣装与姿势参考.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)});
$('#copyImage').onclick=async()=>{try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error('浏览器不支持复制图片');showToast('正在合成图片…');const blob=await merge();await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);showToast('✓ 合并图片已复制')}catch(e){showToast('复制失败，请尝试下载图片',true)}};setMode('costume');
</script></body></html>
