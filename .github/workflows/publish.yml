name: Publish personal website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Prepare Pages files
        run: |
          mkdir -p site/dark
          cp index.html site/index.html
          cp knowledge.html site/knowledge.html
          cp gallery.html site/gallery.html
          cp costume.html site/costume.html
          cp costume-online-test.html site/costume-online-test.html
          cp dark.html site/dark.html
          cp dark/index.html site/dark/index.html
          cp -R assets site/assets
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
